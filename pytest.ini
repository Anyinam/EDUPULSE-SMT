[pytest]
# pytest configuration for EduPulse

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options
# Run with: pytest --cov=backend --cov-report=html
addopts_cov = --cov=backend --cov-report=html --cov-report=term-missing

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    slow: Slow running tests
    smoke: Smoke tests for critical features

# Database
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG

# Timeout for long-running tests (seconds)
timeout = 300
