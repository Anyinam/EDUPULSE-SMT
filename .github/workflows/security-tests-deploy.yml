name: EduPulse Security & Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sanity:
    name: Workflow Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger context
        run: |
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

  # 1. SECURITY SCANNING
  security-scan:
    name: Security & Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install security tools
        run: |
          pip install bandit safety semgrep
      
      - name: Run Bandit (security issues)
        run: |
          bandit -r backend -f json -o bandit-report.json || true
          cat bandit-report.json
      
      - name: Check dependencies for vulnerabilities
        run: |
          safety check --json || true
      
      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep --config=p/owasp-top-ten --json backend || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json

  # 2. LINTING & CODE QUALITY
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install linting tools
        run: |
          pip install pylint flake8 black isort
      
      - name: Format check with Black
        run: |
          black --check backend/ || true
      
      - name: Import sorting check
        run: |
          isort --check-only backend/ || true
      
      - name: Flake8 linting
        run: |
          flake8 backend --count --statistics || true
      
      - name: Pylint analysis
        run: |
          pylint backend --exit-zero

  # 3. UNIT TESTS
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: edupulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/edupulse_test
          JWT_SECRET_KEY: test-secret-key
          FLASK_ENV: testing
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Skip Codecov upload (no token configured)
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: echo "CODECOV_TOKEN is not configured; skipping Codecov upload."
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml

  # 4. DOCKER BUILD & SECURITY SCAN
  build:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: edupulse-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: edupulse-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # 5. DEPENDENCY CHECK
  dependency-check:
    name: Dependency Compliance
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Check requirements licenses
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
          pip-licenses --format=json --output-file=licenses.json || true
      
      - name: Upload licenses report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licenses
          path: licenses.json

  # 6. PRODUCTION DEPLOYMENT (Only on main branch, after all checks pass)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-scan, test, build, dependency-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://your-domain.com' }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deployment image URIs
        run: |
          append_env() {
            local key="$1"
            local value="$2"
            {
              printf '%s<<__ENV__\n' "$key"
              printf '%s\n' "$value"
              printf '__ENV__\n'
            } >> "$GITHUB_ENV"
          }

          append_env "BACKEND_IMAGE" "${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}"
          append_env "FRONTEND_IMAGE" "${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}"

      - name: Set deployment config env
        run: |
          append_env() {
            local key="$1"
            local value="$2"
            {
              printf '%s<<__ENV__\n' "$key"
              printf '%s\n' "$value"
              printf '__ENV__\n'
            } >> "$GITHUB_ENV"
          }

          append_env "ECS_APP_TASK_FAMILY" "${{ vars.ECS_APP_TASK_FAMILY }}"
          append_env "ECS_SCHEDULER_TASK_FAMILY" "${{ vars.ECS_SCHEDULER_TASK_FAMILY }}"
          append_env "ECS_MIGRATION_TASK_FAMILY" "${{ vars.ECS_MIGRATION_TASK_FAMILY }}"
          append_env "ECS_APP_CPU" "${{ vars.ECS_APP_CPU || '1024' }}"
          append_env "ECS_APP_MEMORY" "${{ vars.ECS_APP_MEMORY || '2048' }}"
          append_env "ECS_SCHEDULER_CPU" "${{ vars.ECS_SCHEDULER_CPU || '512' }}"
          append_env "ECS_SCHEDULER_MEMORY" "${{ vars.ECS_SCHEDULER_MEMORY || '1024' }}"
          append_env "ECS_MIGRATION_CPU" "${{ vars.ECS_MIGRATION_CPU || '512' }}"
          append_env "ECS_MIGRATION_MEMORY" "${{ vars.ECS_MIGRATION_MEMORY || '1024' }}"
          append_env "ECS_TASK_EXECUTION_ROLE_ARN" "${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}"
          append_env "ECS_TASK_ROLE_ARN" "${{ vars.ECS_TASK_ROLE_ARN }}"
          append_env "FRONTEND_ORIGIN" "${{ vars.FRONTEND_ORIGIN }}"
          append_env "CORS_ALLOWED_ORIGINS" "${{ vars.CORS_ALLOWED_ORIGINS || vars.FRONTEND_ORIGIN }}"
          append_env "MAIL_SERVER" "${{ vars.MAIL_SERVER || 'smtp.gmail.com' }}"
          append_env "MAIL_PORT" "${{ vars.MAIL_PORT || '587' }}"
          append_env "MAIL_USE_TLS" "${{ vars.MAIL_USE_TLS || 'true' }}"
          append_env "MAIL_USERNAME" "${{ vars.MAIL_USERNAME }}"
          append_env "MAIL_DEFAULT_SENDER" "${{ vars.MAIL_DEFAULT_SENDER }}"
          append_env "WHATSAPP_PHONE_NUMBER_ID" "${{ vars.WHATSAPP_PHONE_NUMBER_ID || '' }}"
          append_env "WHATSAPP_BUSINESS_ACCOUNT_ID" "${{ vars.WHATSAPP_BUSINESS_ACCOUNT_ID || '' }}"
          append_env "PLATFORM_OWNER_KEY_SECRET_ARN" "${{ vars.PLATFORM_OWNER_KEY_SECRET_ARN || '' }}"
          append_env "GUNICORN_WORKERS" "${{ vars.GUNICORN_WORKERS || '4' }}"
          append_env "DATABASE_URL_SECRET_ARN" "${{ vars.DATABASE_URL_SECRET_ARN }}"
          append_env "SECRET_KEY_SECRET_ARN" "${{ vars.SECRET_KEY_SECRET_ARN }}"
          append_env "JWT_SECRET_KEY_SECRET_ARN" "${{ vars.JWT_SECRET_KEY_SECRET_ARN }}"
          append_env "DATA_ENCRYPTION_KEY_SECRET_ARN" "${{ vars.DATA_ENCRYPTION_KEY_SECRET_ARN }}"
          append_env "LEDGER_SECRET_KEY_SECRET_ARN" "${{ vars.LEDGER_SECRET_KEY_SECRET_ARN }}"
          append_env "BANK_WEBHOOK_SECRET_ARN" "${{ vars.BANK_WEBHOOK_SECRET_ARN }}"
          append_env "MAIL_PASSWORD_SECRET_ARN" "${{ vars.MAIL_PASSWORD_SECRET_ARN }}"
          append_env "PAYSTACK_SECRET_KEY_SECRET_ARN" "${{ vars.PAYSTACK_SECRET_KEY_SECRET_ARN }}"
          append_env "PAYSTACK_PUBLIC_KEY_SECRET_ARN" "${{ vars.PAYSTACK_PUBLIC_KEY_SECRET_ARN }}"
          append_env "WHATSAPP_API_TOKEN_SECRET_ARN" "${{ vars.WHATSAPP_API_TOKEN_SECRET_ARN || '' }}"
          append_env "BACKEND_LOG_GROUP" "${{ vars.BACKEND_LOG_GROUP }}"
          append_env "FRONTEND_LOG_GROUP" "${{ vars.FRONTEND_LOG_GROUP }}"
          append_env "SCHEDULER_LOG_GROUP" "${{ vars.SCHEDULER_LOG_GROUP }}"
          append_env "MIGRATION_LOG_GROUP" "${{ vars.MIGRATION_LOG_GROUP }}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Render ECS task definitions
        run: |
          python infra/aws/render_task_definition.py infra/aws/ecs/app-task-definition.json.tpl infra/aws/ecs/app-task-definition.json
          python infra/aws/render_task_definition.py infra/aws/ecs/scheduler-task-definition.json.tpl infra/aws/ecs/scheduler-task-definition.json
          python infra/aws/render_task_definition.py infra/aws/ecs/migration-task-definition.json.tpl infra/aws/ecs/migration-task-definition.json

      - name: Register migration task definition
        id: migration-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://infra/aws/ecs/migration-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --launch-type FARGATE \
            --task-definition "${{ steps.migration-task.outputs.task_def_arn }}" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP_IDS }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER_NAME }}" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER_NAME }}" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = "0"

      - name: Deploy app task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/aws/ecs/app-task-definition.json
          service: ${{ vars.ECS_APP_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Deploy scheduler task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: infra/aws/ecs/scheduler-task-definition.json
          service: ${{ vars.ECS_SCHEDULER_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
      
      - name: Create deployment record
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          auto-merge: false

  # 7. NOTIFICATION
  notify:
    name: Notify on completion
    runs-on: ubuntu-latest
    needs: [security-scan, lint, test, build, dependency-check]
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK }}
        with:
          status: ${{ job.status }}
          text: 'EduPulse CI/CD Pipeline: ${{ job.status }}'
          fields: |
            repo,message,commit,author,action,eventName

      - name: Skip Slack notification (no webhook configured)
        if: always() && env.SLACK_WEBHOOK == ''
        run: echo "SLACK_WEBHOOK is not configured; skipping Slack notification."
      
      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI/CD Pipeline Failed: ${context.payload.head_commit.message}`,
              body: `Build failed on commit: ${context.sha}\n\nCheck: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
