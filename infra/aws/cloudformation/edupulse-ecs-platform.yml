AWSTemplateFormatVersion: '2010-09-09'
Description: EduPulse production platform for ECS Fargate, ALB, ACM, Route53, ECR, and CloudWatch.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  HostedZoneId:
    Type: String
  RootDomainName:
    Type: String
    Description: Base domain, for example edupulse.com.gh
  AppSubdomain:
    Type: String
    Default: app
  ApiSubdomain:
    Type: String
    Default: api
  AppTaskDefinitionArn:
    Type: String
    Description: Initial ECS task definition ARN for the app service.
  SchedulerTaskDefinitionArn:
    Type: String
    Description: Initial ECS task definition ARN for the scheduler service.
  EcsTaskExecutionRoleArn:
    Type: String
  EcsTaskRoleArn:
    Type: String
  AppDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
  SchedulerDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
  ContainerInsightsSetting:
    Type: String
    Default: disabled
    AllowedValues:
      - enabled
      - disabled
    Description: Enable only when you actively need ECS container metrics; it adds CloudWatch cost.
  LogRetentionInDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653
    Description: Lower retention reduces CloudWatch log storage cost.
  EcrImageRetentionCount:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Keep only the most recent images unless you need a deeper rollback window.
  BackendRepositoryName:
    Type: String
    Default: edupulse-backend
  FrontendRepositoryName:
    Type: String
    Default: edupulse-frontend
  AlbCertificateArn:
    Type: String
    Default: ''
    Description: Optional existing ACM certificate ARN. Leave blank to create a new certificate.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional SNS subscription email for CloudWatch alarms.

Conditions:
  CreateCertificate: !Equals [!Ref AlbCertificateArn, '']
  CreateAlarmTopicSubscription: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  EduPulseCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub edupulse-${EnvironmentName}
      ClusterSettings:
        - Name: containerInsights
          Value: !Ref ContainerInsightsSetting

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref BackendRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain last 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${EcrImageRetentionCount}
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref FrontendRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain last 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${EcrImageRetentionCount}
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  DocumentStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  DocumentStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentStorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowApplicationDocumentAccess
            Effect: Allow
            Principal:
              AWS: !Ref EcsTaskRoleArn
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub ${DocumentStorageBucket.Arn}/*
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DocumentStorageBucket.Arn
              - !Sub ${DocumentStorageBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/edupulse-${EnvironmentName}-backend
      RetentionInDays: !Ref LogRetentionInDays

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/edupulse-${EnvironmentName}-frontend
      RetentionInDays: !Ref LogRetentionInDays

  SchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/edupulse-${EnvironmentName}-scheduler
      RetentionInDays: !Ref LogRetentionInDays

  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/edupulse-${EnvironmentName}-migration
      RetentionInDays: !Ref LogRetentionInDays

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub edupulse-${EnvironmentName}-alerts

  AlarmTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateAlarmTopicSubscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlarmTopic

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EduPulse ALB security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AppServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EduPulse app ECS service security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  SchedulerServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EduPulse scheduler ECS service security group
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  EduPulseLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub edupulse-${EnvironmentName}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref PublicSubnetIds

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub edupulse-${EnvironmentName}-fe
      VpcId: !Ref VpcId
      Port: 80
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200-399

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub edupulse-${EnvironmentName}-api
      VpcId: !Ref VpcId
      Port: 5000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200-399

  EduPulseCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref RootDomainName
      SubjectAlternativeNames:
        - !Sub ${AppSubdomain}.${RootDomainName}
        - !Sub ${ApiSubdomain}.${RootDomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref RootDomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub ${AppSubdomain}.${RootDomainName}
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub ${ApiSubdomain}.${RootDomainName}
          HostedZoneId: !Ref HostedZoneId

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref EduPulseLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref EduPulseLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !If [CreateCertificate, !Ref EduPulseCertificate, !Ref AlbCertificateArn]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  ApiHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub ${ApiSubdomain}.${RootDomainName}
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  ApiPathRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  AppRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub ${AppSubdomain}.${RootDomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt EduPulseLoadBalancer.DNSName
        HostedZoneId: !GetAtt EduPulseLoadBalancer.CanonicalHostedZoneID

  ApiRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub ${ApiSubdomain}.${RootDomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt EduPulseLoadBalancer.DNSName
        HostedZoneId: !GetAtt EduPulseLoadBalancer.CanonicalHostedZoneID

  AppService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
    Properties:
      ServiceName: !Sub edupulse-${EnvironmentName}-app
      Cluster: !Ref EduPulseCluster
      TaskDefinition: !Ref AppTaskDefinitionArn
      LaunchType: FARGATE
      DesiredCount: !Ref AppDesiredCount
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref AppServiceSecurityGroup
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: edupulse-frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
        - ContainerName: edupulse-backend
          ContainerPort: 5000
          TargetGroupArn: !Ref BackendTargetGroup

  SchedulerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub edupulse-${EnvironmentName}-scheduler
      Cluster: !Ref EduPulseCluster
      TaskDefinition: !Ref SchedulerTaskDefinitionArn
      LaunchType: FARGATE
      DesiredCount: !Ref SchedulerDesiredCount
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SchedulerServiceSecurityGroup
          Subnets: !Ref PublicSubnetIds

  AppTargetResponseTimeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub edupulse-${EnvironmentName}-alb-target-response-time
      AlarmDescription: Alert when ALB target response time is consistently high.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 3
      Period: 60
      Statistic: Average
      Threshold: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt EduPulseLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName

  Frontend5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub edupulse-${EnvironmentName}-alb-5xx
      AlarmDescription: Alert when the ALB returns repeated 5xx responses.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Sum
      Threshold: 5
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt EduPulseLoadBalancer.LoadBalancerFullName

Outputs:
  ClusterName:
    Value: !Ref EduPulseCluster
  AppServiceName:
    Value: !GetAtt AppService.Name
  SchedulerServiceName:
    Value: !GetAtt SchedulerService.Name
  LoadBalancerDnsName:
    Value: !GetAtt EduPulseLoadBalancer.DNSName
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
  BackendLogGroupName:
    Value: !Ref BackendLogGroup
  FrontendLogGroupName:
    Value: !Ref FrontendLogGroup
  SchedulerLogGroupName:
    Value: !Ref SchedulerLogGroup
  MigrationLogGroupName:
    Value: !Ref MigrationLogGroup
  AlertTopicArn:
    Value: !Ref AlarmTopic
  DocumentStorageBucketName:
    Value: !Ref DocumentStorageBucket
  EffectiveCertificateArn:
    Value: !If [CreateCertificate, !Ref EduPulseCertificate, !Ref AlbCertificateArn]