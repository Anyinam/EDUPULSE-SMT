<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome Black version - for printing and professional use -->
  <!-- Brain outline - left hemisphere -->
  <circle cx="70" cy="80" r="20" stroke="#000000" stroke-width="2.5" fill="none"/>
  
  <!-- Brain outline - right hemisphere -->
  <circle cx="130" cy="80" r="20" stroke="#000000" stroke-width="2.5" fill="none"/>
  
  <!-- Brain outline - connector -->
  <path d="M 75 95 Q 100 120 125 95" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Pulse/circuit lines -->
  <path d="M 70 65 L 70 50 L 130 50 L 130 65" stroke="#333333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Pulse circuit endpoints -->
  <circle cx="70" cy="50" r="3" fill="#333333"/>
  <circle cx="130" cy="50" r="3" fill="#333333"/>
  
  <!-- Learning indicator arrow -->
  <path d="M 100 130 L 100 150 L 90 140 M 100 150 L 110 140" stroke="#666666" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
