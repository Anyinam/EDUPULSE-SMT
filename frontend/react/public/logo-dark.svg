<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark theme color scheme -->
  <!-- Brain outline - left hemisphere -->
  <circle cx="70" cy="80" r="20" stroke="#7986cb" stroke-width="2.5" fill="none"/>
  
  <!-- Brain outline - right hemisphere -->
  <circle cx="130" cy="80" r="20" stroke="#7986cb" stroke-width="2.5" fill="none"/>
  
  <!-- Brain outline - connector -->
  <path d="M 75 95 Q 100 120 125 95" stroke="#7986cb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Pulse/circuit lines -->
  <path d="M 70 65 L 70 50 L 130 50 L 130 65" stroke="#ff5252" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Pulse circuit endpoints -->
  <circle cx="70" cy="50" r="3" fill="#ff5252"/>
  <circle cx="130" cy="50" r="3" fill="#ff5252"/>
  
  <!-- Learning indicator arrow -->
  <path d="M 100 130 L 100 150 L 90 140 M 100 150 L 110 140" stroke="#4dd0e1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
