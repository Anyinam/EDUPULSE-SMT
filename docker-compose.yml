

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:5000:5000"
    environment:
      # Security: Load from .env file, never hardcode secrets
      - POSTGRES_USER=${POSTGRES_USER:-edupulse_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong value in .env / secrets manager)}
      - POSTGRES_DB=${POSTGRES_DB:-edupulse_db}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (32+ chars; do not use a default)}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required (32+ chars; do not use a default)}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required (Fernet key) }
      - LEDGER_SECRET_KEY=${LEDGER_SECRET_KEY:?LEDGER_SECRET_KEY is required (32+ chars) }
      - BANK_WEBHOOK_SECRET=${BANK_WEBHOOK_SECRET:?BANK_WEBHOOK_SECRET is required for signed provider callbacks}
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=0
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - RUN_DB_MIGRATIONS=${RUN_DB_MIGRATIONS:-false}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - ENABLE_SCHEDULER=false
      - APP_ROLE=web
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-True}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-}
      - SEED_PROPRIETOR_EMAIL=${SEED_PROPRIETOR_EMAIL:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - ALLOW_ALL_DASHBOARDS=${ALLOW_ALL_DASHBOARDS:-False}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - PLATFORM_OWNER_KEY=${PLATFORM_OWNER_KEY}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: ./backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-edupulse_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong value in .env / secrets manager)}
      - POSTGRES_DB=${POSTGRES_DB:-edupulse_db}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (32+ chars; do not use a default)}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required (32+ chars; do not use a default)}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required (Fernet key) }
      - LEDGER_SECRET_KEY=${LEDGER_SECRET_KEY:?LEDGER_SECRET_KEY is required (32+ chars) }
      - BANK_WEBHOOK_SECRET=${BANK_WEBHOOK_SECRET:?BANK_WEBHOOK_SECRET is required for signed provider callbacks}
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=0
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - RUN_DB_MIGRATIONS=false
      - SEED_DEMO_DATA=false
      - ENABLE_SCHEDULER=true
      - APP_ROLE=scheduler
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-True}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-}
      - SEED_PROPRIETOR_EMAIL=${SEED_PROPRIETOR_EMAIL:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - ALLOW_ALL_DASHBOARDS=${ALLOW_ALL_DASHBOARDS:-False}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - PLATFORM_OWNER_KEY=${PLATFORM_OWNER_KEY}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-edupulse_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong value in .env / secrets manager)}
      - POSTGRES_DB=${POSTGRES_DB:-edupulse_db}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "${DB_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupulse_user} -d ${POSTGRES_DB:-edupulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend service with optimized nginx config
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - API_UPSTREAM_URL=${API_UPSTREAM_URL:-http://backend:5000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
